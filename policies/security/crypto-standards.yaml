# Cryptographic Standards Policy
# Defines approved cryptographic algorithms and key requirements

apiVersion: itqahn.io/v1
kind: SecurityPolicy
metadata:
  name: crypto-standards
  version: 2.0.0

spec:
  description: "Cryptographic algorithm requirements and key management standards"
  enforcement: required
  scope: all_services

  # TLS Configuration
  tls:
    minimum_version: "1.2"
    preferred_version: "1.3"

    allowed_cipher_suites:
      tls_1_3:
        - TLS_AES_256_GCM_SHA384
        - TLS_CHACHA20_POLY1305_SHA256
        - TLS_AES_128_GCM_SHA256

      tls_1_2:
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256

    forbidden_cipher_suites:
      - "*CBC*"
      - "*RC4*"
      - "*DES*"
      - "*MD5*"
      - "*NULL*"
      - "*EXPORT*"

  # Symmetric Encryption
  symmetric:
    allowed_algorithms:
      - name: AES-256-GCM
        purpose: [encryption, authenticated_encryption]
        key_size: 256

      - name: AES-128-GCM
        purpose: [encryption, authenticated_encryption]
        key_size: 128

      - name: ChaCha20-Poly1305
        purpose: [authenticated_encryption]
        key_size: 256

    forbidden_algorithms:
      - DES
      - 3DES
      - RC4
      - Blowfish
      - AES-ECB

  # Asymmetric Encryption
  asymmetric:
    allowed_algorithms:
      - name: RSA
        min_key_size: 2048
        preferred_key_size: 4096
        purpose: [signing, encryption]

      - name: ECDSA
        curves: [P-256, P-384, P-521]
        purpose: [signing]

      - name: Ed25519
        purpose: [signing]
        preferred: true

    forbidden_algorithms:
      - RSA < 2048 bits
      - DSA

  # Hashing
  hashing:
    allowed_algorithms:
      - name: SHA-256
        purpose: [integrity, signing]

      - name: SHA-384
        purpose: [integrity, signing]

      - name: SHA-512
        purpose: [integrity, signing]

      - name: BLAKE2b
        purpose: [integrity]

      - name: SHA-3
        purpose: [integrity, signing]

    forbidden_algorithms:
      - MD5
      - SHA-1

  # Password Hashing
  password_hashing:
    allowed_algorithms:
      - name: Argon2id
        preferred: true
        min_memory: 64MB
        min_iterations: 3

      - name: bcrypt
        min_cost: 12

      - name: scrypt
        min_n: 2^17
        min_r: 8

    forbidden_algorithms:
      - MD5
      - SHA-1
      - SHA-256 (plain)
      - PBKDF2 with < 600000 iterations

  # Key Management
  key_management:
    storage:
      - method: HSM
        for: [signing_keys, root_keys]

      - method: Vault
        for: [encryption_keys, api_keys]

    rotation:
      encryption_keys:
        max_age_days: 365

      signing_keys:
        max_age_days: 730

      tls_certificates:
        max_age_days: 90

    derivation:
      allowed_kdf:
        - HKDF
        - PBKDF2

  # Validation
  validation:
    scan_frequency: weekly
    alert_on_violation: true
    block_deployment: true

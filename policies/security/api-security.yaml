# API Security Policy
# Defines security requirements for all APIs

apiVersion: itqahn.io/v1
kind: SecurityPolicy
metadata:
  name: api-security
  version: 2.0.0

spec:
  description: "Security requirements for API design and implementation"
  enforcement: required
  scope: all_apis

  # Transport Security
  transport:
    tls_required: true
    minimum_tls_version: "1.2"
    hsts_enabled: true

  # Input Validation
  input_validation:
    required: true
    requirements:
      - validate_content_type: true
      - validate_content_length: true
      - max_request_size_mb: 10
      - reject_unknown_fields: true

    sanitization:
      required_for:
        - user_input
        - query_parameters
        - path_parameters
        - headers

    encoding:
      validate_utf8: true
      reject_null_bytes: true

  # Output Encoding
  output_encoding:
    json:
      escape_html: true
      content_type: "application/json; charset=utf-8"

    prevent_information_disclosure:
      - hide_stack_traces
      - generic_error_messages
      - no_version_headers

  # Rate Limiting
  rate_limiting:
    required: true
    default_limits:
      requests_per_minute: 100
      requests_per_hour: 1000

    response_headers:
      include:
        - X-RateLimit-Limit
        - X-RateLimit-Remaining
        - X-RateLimit-Reset

  # Authorization
  authorization:
    required: true
    model: RBAC
    requirements:
      - check_on_every_request: true
      - fail_closed: true
      - log_authorization_decisions: true

    forbidden_patterns:
      - client_side_authorization
      - authorization_in_query_string

  # Request/Response Security
  request_security:
    forbidden_methods:
      - TRACE
      - TRACK

    cors:
      allowed_origins: explicit_list
      allow_credentials: false
      max_age_seconds: 86400
      forbidden:
        - "Access-Control-Allow-Origin: *" (with credentials)

  # Error Handling
  error_handling:
    requirements:
      - consistent_error_format: true
      - no_sensitive_data_in_errors: true
      - appropriate_status_codes: true

    error_response_format:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string

  # Logging
  logging:
    required_fields:
      - timestamp
      - request_id
      - client_ip
      - user_agent
      - method
      - path
      - status_code
      - duration_ms

    sensitive_fields:
      redact:
        - Authorization header
        - Cookie header
        - Request body (sensitive endpoints)
        - Response body (sensitive endpoints)

  # Versioning
  versioning:
    required: true
    method: url_path
    format: "/api/v{major}"
    deprecation:
      notice_period_days: 90
      sunset_header: true

  # Documentation
  documentation:
    openapi_required: true
    security_schemes_documented: true
    example_requests: required

  # Validation
  validation:
    scan_frequency: continuous
    methods:
      - static_analysis
      - runtime_testing
    alert_on_violation: true

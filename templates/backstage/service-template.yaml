apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: itqahn-service
  title: Itqahn Service
  description: Create a new Itqahn-compliant backend service
  tags:
    - backend
    - service
    - itqahn
spec:
  owner: platform-team
  type: service

  parameters:
    - title: Service Information
      required:
        - name
        - description
        - owner
      properties:
        name:
          title: Service Name
          type: string
          description: Unique name for your service (lowercase, hyphens allowed)
          pattern: "^[a-z][a-z0-9-]*$"
          ui:autofocus: true

        description:
          title: Description
          type: string
          description: Brief description of what this service does

        owner:
          title: Owner
          type: string
          description: Team that owns this service
          ui:field: OwnerPicker
          ui:options:
            allowedKinds:
              - Group

    - title: Technical Configuration
      required:
        - language
        - complianceTier
      properties:
        language:
          title: Language
          type: string
          enum:
            - typescript
            - python
            - go
          default: typescript

        complianceTier:
          title: Compliance Tier
          type: string
          enum:
            - baseline
            - sensitive
            - regulated
          default: baseline
          description: Determines security and compliance requirements

        hasDatabase:
          title: Requires Database
          type: boolean
          default: false

        hasQueue:
          title: Requires Message Queue
          type: boolean
          default: false

    - title: Repository
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: fetch-base
      name: Fetch Base Template
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          language: ${{ parameters.language }}
          complianceTier: ${{ parameters.complianceTier }}
          hasDatabase: ${{ parameters.hasDatabase }}
          hasQueue: ${{ parameters.hasQueue }}

    - id: publish
      name: Publish Repository
      action: publish:github
      input:
        allowedHosts:
          - github.com
        repoUrl: ${{ parameters.repoUrl }}
        description: ${{ parameters.description }}
        defaultBranch: main
        protectDefaultBranch: true
        requireCodeOwnerReviews: true

    - id: register
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
